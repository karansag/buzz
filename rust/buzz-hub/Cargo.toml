[package]
name = "buzz-hub"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
caseless = "0.2"
fastrand = "2"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "time", "io-util"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
