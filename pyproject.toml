[project]
name = "agent-swarm"
version = "0.1.0"
description = "Buzz: run many coding agents in tmux and let them talk to each other"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Karan Sagar" },
]
dependencies = [
    # Security floors also apply to fresh installs outside the checked-in lockfile.
    "anyio>=4.14.2",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "starlette>=1.7.0",
    "uvicorn[standard]>=0.46.0",
]

[project.urls]
Homepage = "https://github.com/karansag/buzz"
Repository = "https://github.com/karansag/buzz"
Issues = "https://github.com/karansag/buzz/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_swarm*"]
exclude = ["skills*", "tests*", "docs*"]

[tool.setuptools.package-data]
agent_swarm = ["portal.html", "static/*.css", "static/*.js", "static/*.png", "static/*.svg", "static/*.webmanifest"]

[project.scripts]
agent-swarm = "agent_swarm.client:main"
agent-swarm-server = "agent_swarm.server:_run"
agent-swarm-node = "agent_swarm.node:_run"
agent-msg = "agent_swarm.client:main"
agent-msg-server = "agent_swarm.server:_run"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
