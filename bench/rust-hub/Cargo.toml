[package]
name = "rust-hub-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8.9"
rusqlite = { version = "0.32.1", features = ["functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
